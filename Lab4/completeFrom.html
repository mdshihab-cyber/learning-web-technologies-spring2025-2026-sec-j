<!DOCTYPE html>
<html>
<head>
    <title>Person Profile</title>
    <style>
        table {
            border-collapse: collapse;
            width: 450px;
            font-family: sans-serif;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
        }
        th {
            font-size: 20px;
            text-align: center;
            padding: 15px;
        }
    </style>
    <script>
        function validateForm() {

            let name = document.getElementById("name").value.trim();
            if (name === "") {
                alert("Name cannot be empty.");
                return false;
            }
            if (name.indexOf(" ") === -1) {
                alert("Name must contain at least two words.");
                return false;
            }
            let firstChar = name.charAt(0);
            let isFirstCharLetter = (firstChar >= 'a' && firstChar <= 'z') || (firstChar >= 'A' && firstChar <= 'Z');
            if (!isFirstCharLetter) {
                alert("Name must start with a letter.");
                return false;
            }
            for (let i = 0; i < name.length; i++) {
                let char = name[i];
                let isValidChar = (char >= 'a' && char <= 'z') || (char >= 'A' && char <= 'Z') || char === '.' || char === '-' || char === ' ';
                if (!isValidChar) {
                    alert("Name can only contain letters, dots(.), or dashes(-).");
                    return false;
                }
            }

            let email = document.getElementById("email").value.trim();
            if (email === "") {
                alert("Email cannot be empty.");
                return false;
            }
            let atIdx = email.indexOf("@");
            let dotIdx = email.lastIndexOf(".");
            if (atIdx === -1 || dotIdx === -1 || dotIdx < atIdx) {
                alert("Must be a valid email address (e.g., sample@example.com).");
                return false;
            }

            let genders = document.getElementsByName("gender");
            let isGenderChecked = false;
            for (let i = 0; i < genders.length; i++) {
                if (genders[i].checked) {
                    isGenderChecked = true;
                    break;
                }
            }
            if (!isGenderChecked) {
                alert("Please select a gender.");
                return false;
            }


            let dd = document.getElementById("dd").value.trim();
            let mm = document.getElementById("mm").value.trim();
            let yyyy = document.getElementById("yyyy").value.trim();
            if (dd === "" || mm === "" || yyyy === "") {
                alert("Date of Birth cannot be empty.");
                return false;
            }
            if (isNaN(dd) || Number(dd) < 0 || Number(dd) > 31) {
                alert("Day (dd) must be a valid number between 0 and 31.");
                return false;
            }
            if (isNaN(mm) || Number(mm) < 1 || Number(mm) > 12) {
                alert("Month (mm) must be a valid number between 1 and 12.");
                return false;
            }
            if (isNaN(yyyy) || Number(yyyy) < 1900 || Number(yyyy) > 2016) {
                alert("Year (yyyy) must be a valid number between 1900 and 2016.");
                return false;
            }

            let bg = document.getElementById("bg").value;
            if (bg === "") {
                alert("Blood group must be selected.");
                return false;
            }

            let degrees = document.getElementsByName("degree");
            let isDegreeChecked = false;
            for (let i = 0; i < degrees.length; i++) {
                if (degrees[i].checked) {
                    isDegreeChecked = true;
                    break;
                }
            }
            if (!isDegreeChecked) {
                alert("Please select at least one degree.");
                return false;
            }

            let photo = document.getElementById("photo").value;
            if (photo === "") {
                alert("Picture cannot be empty. Please select a file.");
                return false;
            }

            alert("Person Profile validation successful! Form is ready to submit.");
            return true;
        }
    </script>
</head>
<body>

    <form onsubmit="return validateForm()">
        <table>
            <tr>
                <th colspan="2">PERSON PROFILE</th>
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text" id="name"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="text" id="email"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male"> Male 
                    <input type="radio" name="gender" value="Female"> Female 
                    <input type="radio" name="gender" value="Other"> Other
                </td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="text" id="dd" size="2"> /
                    <input type="text" id="mm" size="2"> /
                    <input type="text" id="yyyy" size="4"> 
                    <i>(dd/mm/yyyy)</i>
                </td>
            </tr>
            <tr>
                <td>Blood Group</td>
                <td>
                    <select id="bg">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Degree</td>
                <td>
                    <input type="checkbox" name="degree" value="SSC"> SSC 
                    <input type="checkbox" name="degree" value="HSC"> HSC 
                    <input type="checkbox" name="degree" value="BSc"> BSc. 
                    <input type="checkbox" name="degree" value="MSc"> MSc.
                </td>
            </tr>
            <tr>
                <td>Photo</td>
                <td><input type="file" id="photo"></td>
            </tr>
            <tr>
                <td colspan="2" style="border-bottom: none;">&nbsp;</td> </tr>
            <tr>
                <td colspan="2" style="text-align: right; border-top: none;">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
